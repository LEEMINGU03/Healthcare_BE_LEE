spring.application.name=Healthcare_BE
spring.profiles.active=local

spring.datasource.url= jdbc:postgresql://localhost:5432/Healcare_db
spring.datasource.username=Healthcare_LEE

# 테이블은 database.md의 DDL로 직접 만든다 — Hibernate는 만들지 않고 어긋남만 검증한다.
spring.jpa.hibernate.ddl-auto=create

# 에러 응답을 RFC 7807 ProblemDetail로 통일 (api.md 1장)
spring.mvc.problemdetails.enabled=true
server.forward-headers-strategy=framework

# AI 서버 (api.md 4장). 인증 없음 — 로그인 기능은 추후 구현 예정.
ai.base-url=https://healthcare-agent-ttrw.vercel.app

# 로그인
# 구글 (client-id/client-secret은 application-local.properties, Railway는 환경변수로)
spring.security.oauth2.client.registration.google.scope=profile,email

# JWT (비밀키는 application-local.properties, Railway는 환경변수로)
app.jwt.access-token-expiry-minutes=15
app.jwt.refresh-token-expiry-days=14
# 로그인 성공 시 일회용 교환 code(?code=...)를 실어 리다이렉트할 프론트 콜백 경로.
# 프론트는 이 code를 POST /api/auth/exchange로 바꿔서 진짜 토큰을 받는다.
app.oauth2.redirect-uri=https://healthchatbot-front-end-u557.vercel.app/oauth/callback